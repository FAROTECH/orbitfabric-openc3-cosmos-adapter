site_name: OrbitFabric OpenC3 COSMOS Adapter
site_description: User, developer and publisher guide for the OrbitFabric OpenC3 COSMOS adapter.
site_url: https://farotech.github.io/orbitfabric-openc3-cosmos-adapter/
repo_url: https://github.com/FAROTECH/orbitfabric-openc3-cosmos-adapter
repo_name: FAROTECH/orbitfabric-openc3-cosmos-adapter
edit_uri: ""

docs_dir: docs

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - User:
      - Getting Started: getting-started.md
      - Product Example: examples.md
      - Projection Profile and Bindings: projection-profile-and-bindings.md
      - Runtime Dependencies: runtime-dependencies.md
      - Integration Coverage: integration-coverage.md
  - Developer / Contributor:
      - Development: development.md
      - Architecture and Ownership: architecture-and-ownership.md
      - Integration Contracts: integration-contracts.md
      - Testing and Conformance: testing-and-conformance.md
  - Maintainer / Publisher:
      - Publishing: publishing.md
      - Release Lifecycle: release-lifecycle.md
      - Native COSMOS Acceptance: native-cosmos-acceptance.md
      - Evidence and Traceability: evidence-and-traceability.md
      - Adapter Identity: adapter-identity.md
