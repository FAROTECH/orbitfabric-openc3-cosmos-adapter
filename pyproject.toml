[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "orbitfabric-openc3-cosmos-adapter"
version = "0.1.0.dev0"
description = "OrbitFabric adapter for OpenC3 COSMOS verification projection."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "OrbitFabric Contributors" }
]
dependencies = [
  "orbitfabric @ git+https://github.com/FAROTECH/orbitfabric.git@4377d6656c62aa1dc19a7ed81d2de872b6b22ccd",
  "PyYAML>=6.0",
  "jsonschema>=4.23"
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mkdocs-material>=9.5",
  "pytest>=8.0",
  "ruff>=0.5"
]

[project.scripts]
orbitfabric-openc3-cosmos = "orbitfabric_openc3_cosmos_adapter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/orbitfabric_openc3_cosmos_adapter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []
